# TrimUI Brick (Allwinner A133P, TG3040; 1024x768 DSI panel, no sticks, XR829 radio, stock firmware on the
# eMMC). Sourced by scripts/build.sh, read by scripts/make-own-kernel-stock.sh (docs/trimui.md).
BOARD=brick
DEVICE_MARKER=brick           # written to /usr/magicx/device; spruce reads it to pick the platform
ENCRYPT_OBJ=stub              # no board-auth object in the kernel
OWN_AB=1                      # slot B (boot_b, rootfs_b) and an own-lane update beside the image (docs/updates.md)
OWN_STOCK_DT=1                # TrimUI's boot0, U-Boot package (device tree inside) and boot-resource, byte-identical
OWN_EMMC=1                    # the stock eMMC is mmcblk0: root by PARTUUID (oak_root), and nothing mounts the eMMC
OWN_TRIMUI_INPUTD=1           # TrimUI's trimui_inputd from the stock rootfs: a LOCAL image (user, 2026-10-25)
OWN_TRIMUI_GPIO="107=1 227=0 243=in"   # as stock runtrimui.sh: PD11 high (VCC-5V), PH3 rumble off, PH19 DIP switch in
OWN_AUTOLOAD_DROP="net-rtl8189es"      # the radio is the XR829 (net-xr829 stays)
# OWN_DIAG unset: the first card is diagnostic (colour ladder, early probe); OWN_DIAG=0 once it boots.
# No board.dts or sys_config.fex: on this lane they only shape the SDK image, which no card carries;
# the card boots TrimUI's own tree. sys_partition.fex is every board's (the SDK image packs with it).
# Panel: sdk-patches/tree/160 (otm1289a, follows U-Boot's lcd=).
