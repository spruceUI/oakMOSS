# Powkiddy V20 (Allwinner A133P, DDR3; vertical, two sticks). Sourced by scripts/build.sh.
# UNTESTED: carried from the V90S (same stock firmware and tree); no unit in the lab.
BOARD=v20
DEVICE_MARKER=v20             # written to /usr/magicx/device; spruce reads it to pick the platform
ENCRYPT_OBJ=stub              # the stock kernel carries no board-auth object
SD2_CD_PIN=PG6                # the second card slot's card-detect (TF1 is PF6): oakmoss-cards.sh
USB_WIFI=1                    # 8188eu.ko + 8812au.ko for USB dongles on the USB-C port (scripts/build-usb-wifi.sh)
OWN_DIAG=0                    # make-own-kernel-stock.sh: the stock hand-off unless DIAG=1 asks for the diagnostic one
OWN_AUTOLOAD_DROP="net-rtl8189es net-xr829"   # no SDIO radio: the SDK's SDIO WiFi autoloads (cfg80211 stays for USB)
OWN_AB=1                      # slot B (boot_b, rootfs_b) and an own-lane update beside the image (docs/updates.md)
OWN_BOOTRES_FILES=1           # boot-resource/: the oakMOSS boot logo and charge pictures, in a copy of the stock partition
# Panel RGP35_NV3051 640x480 4-lane DSI (sdk-patches/tree/150), pad = the stock "adc-joypad"
# binding (151): GPIO buttons, L3/R3 on PD21/PD20, two sticks behind the GPADC multiplexer,
# no rumble. Knulli's V20 tree maps the right stick's axes the other way round from the
# stock binding's default (its mux-axes); the stock order is kept until a unit shows which.
