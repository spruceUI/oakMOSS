# MagicX Zero 40 (Allwinner A133P, board a133-aw3). Sourced by scripts/build.sh.
BOARD=zero40
DEVICE_MARKER=zero40          # written to /usr/magicx/device; spruce reads it to pick the platform
ENCRYPT_OBJ=zero40            # kernel sunxi_encrypt object from MagicX's Zero40-lichee.zip
                              # (md5 33a0a6d729e24ae34877a7cbdb479cbe; inputs/README.md), never in git
# Panel RTP40WV101B 480x800 + axs15205 touch: NOT in the SDK drop. The image this
# board actually boots is the hybrid (scripts/make-hybrid-zero40.sh): main-zero40's
# boot chain + this rootfs. Our own chain drives the Zero 28 panel (white screen).
