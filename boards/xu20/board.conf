# MagicX XU20 V32 (XU RETRO; Allwinner A133P, board a133-aw3). Sourced by scripts/build.sh.
BOARD=xu20
DEVICE_MARKER=xu20            # written to /usr/magicx/device; spruce reads it to pick the platform
ENCRYPT_OBJ=sdk               # the XU20 shipped with Android only: no per-board sunxi_encrypt object
                              # exists for a Linux kernel, and the driver is an identity misc device,
                              # not a boot gate (docs/hardware-notes.md), so the SDK's object serves
# Own kernel: panel RTP32HD016A (1024x768, two-lane DSI) is in sdk-patches/tree/070-*, the
# board.dts beside this file carries the stock tree's panel timings, pad map, radio node and
# battery model. Touch (Hynitron, twi1 0x5a) is not ported yet. The image a unit boots is
# scripts/make-own-kernel-stock.sh: the stock Android boot0 + U-Boot (proven, two cards)
# with THIS build's kernel, device tree and rootfs. The Android-kernel lane
# (make-hybrid-stock.sh) stays for reference: its GPU userland cannot initialize.
