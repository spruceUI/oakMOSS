# MagicX Mini Zero 28 (Allwinner A133P, board a133-aw3). Sourced by scripts/build.sh.
BOARD=zero28
DEVICE_MARKER=zero28          # written to /usr/magicx/device; spruce reads it to pick the platform
ENCRYPT_OBJ=sdk               # kernel sunxi_encrypt object: the SDK's own (md5 f28d35ebe4929e4c916ab7095dffeae7)
# Panel h028b23 480x640 (portrait-native, drawn as 640x480 landscape by the launcher);
# pad = simplepad driver, kernel name "magicx-input"; radio = Realtek 8189es (SDIO).
