# Powkiddy V90S (Allwinner A133P, DDR3; clamshell, no sticks). Sourced by scripts/build.sh.
BOARD=v90s
DEVICE_MARKER=v90s            # written to /usr/magicx/device; spruce reads it to pick the platform
ENCRYPT_OBJ=stub              # the stock kernel carries no board-auth object
SD2_CD_PIN=PG6                # the second card slot's card-detect (TF1 is PF6): oakmoss-cards.sh
# Panel RGP35_NV3051 640x480 4-lane DSI (sdk-patches/tree/150), pad = the stock "adc-joypad"
# binding (151): GPIO buttons, rumble on PWM2 (PD20). No onboard radio. board.dts and
# sys_config.fex are generated from the stock tree (scripts/make-board-dts-powkiddy.py,
# make-sys-config-powkiddy.py). The image a unit boots: scripts/make-own-kernel-stock.sh,
# the stock boot0 (DDR3 576 MHz) and U-Boot with this build's kernel, tree and rootfs.
